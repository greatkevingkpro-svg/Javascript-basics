<!DOCTYPE html>
<html>
  <head>
    <title>Cart Quantity</title>
  </head>
  <body>
    <button onclick="
    console.log(`cart quantity: ${cartQuantity}`);
    ">
      Show Quantity
    </button>
    
    <button onclick="
    cartQuantity ++;
    
    if (cartQuantity >= 10) {
      cartQuantity = 'full';
      // console.log(cartQuantity);
      alert(`the cart is full`);
    } else {
      console.log(`cart quantity: ${cartQuantity}`);
    }
    ">
      Add to Cart
    </button>
    
    <button onclick="
    cartQuantity += 2;
    console.log(`cart quantity: ${cartQuantity}`);
    if (cartQuantity >= 10) {
      alert(`the cart is full`);
    }
    ">
      +2
    </button>
    
    <button onclick="
    cartQuantity += 3;
    console.log(`cart quantity: ${cartQuantity}`);
    if (cartQuantity >= 10) {
      alert(`the cart is full`);
    }
    ">
      +3
    </button>

    <button onclick="
    cartQuantity += 4;
    console.log(`cart quantity: ${cartQuantity}`);
    if (cartQuantity >= 10) {
      alert(`the cart is full`);
    }
    ">
      +4
    </button>

    <button onclick="
    cartQuantity += 5;
    console.log(`cart quantity: ${cartQuantity}`);
    if (cartQuantity >= 10) {
      alert(`the cart is full`);
    }
    ">
      +5
    </button>

    <button onclick="
    cartQuantity -= 5;
    console.log(`cart quantity: ${cartQuantity}`);
    if (cartQuantity < 0) {
      alert(`not enough item`);
    }
    ">
      -5
    </button>
    
    <button onclick="
    cartQuantity -= 4;
    console.log(`cart quantity: ${cartQuantity}`);
    if (cartQuantity < 0) {
      alert(`not enough item`);
    }
    ">
      -4
    </button>

    <button onclick="
    cartQuantity -= 3;
    console.log(`cart quantity: ${cartQuantity}`);
    if (cartQuantity < 0) {
      alert(`not enough item`);
    }
    ">
      -3
    </button>
    
    <button onclick="
    cartQuantity -= 2;
    console.log(`cart quantity: ${cartQuantity}`);
    if (cartQuantity < 0) {
      alert(`not enough item`);
    }
    ">
      -2
    </button>
    
    <button onclick="
    cartQuantity --;
    console.log(`cart quantity: ${cartQuantity}`);
    if (cartQuantity < 0) {
      alert(`not enough item`);
    }
    ">
      Remove Cart
    </button>
    
    <button onclick="
    cartQuantity = 0;
    console.log('Cart was reset');
    console.log(`cart quantity: ${cartQuantity}`);
    ">
      Reset Cart
    </button>

      let cartQuantity = 0;
